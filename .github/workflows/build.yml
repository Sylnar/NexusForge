name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (all installs auto-update to it)"
        type: boolean
        default: false
      update_notes:
        description: "Only refresh the notes of the existing release for this version from CHANGELOG.md"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish src/NexusForge/NexusForge.csproj
          -c Release -r win-x64
          -o dist

      - name: Read exe version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Item dist/Sylnar.exe).VersionInfo.ProductVersion -replace '\+.*$',''
          "version=$v" >> $env:GITHUB_OUTPUT
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}'.TrimStart('v') -ne $v) {
            throw "Exe version $v does not match tag ${{ github.ref_name }}"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Sylnar
          path: dist/Sylnar.exe
          if-no-files-found: error

    outputs:
      version: ${{ steps.ver.outputs.version }}

  release:
    # Publishing a release makes every installed copy auto-update to it, so it
    # only runs for a pushed v* tag or a manual run with "release" ticked.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Sylnar

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: v${{ needs.build.outputs.version }}
        run: |
          # The "## vX.Y.Z" section for this version, without its heading.
          awk -v tag="$TAG" '
            /^## v/ { if (found) exit; if (index($0, "## " tag) == 1) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See the commit history for the changes in this release." > notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: >
          gh release create "$TAG" Sylnar.exe
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "Sylnar $TAG"
          --notes-file notes.md

  release-notes:
    # Rewrites the notes of an already-published release; the exe is untouched.
    if: github.event_name == 'workflow_dispatch' && inputs.update_notes && !inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          awk -v tag="$TAG" '
            /^## v/ { if (found) exit; if (index($0, "## " tag) == 1) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No $TAG section in CHANGELOG.md"; exit 1; }
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
