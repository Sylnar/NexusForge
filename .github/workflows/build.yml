name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish src/NexusForge/NexusForge.csproj
          -c Release -r win-x64
          -o dist

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Item dist/Sylnar.exe).VersionInfo.ProductVersion -replace '\+.*$',''
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -ne $tag) { throw "Exe version $v does not match tag $tag" }

      - uses: actions/upload-artifact@v4
        with:
          name: Sylnar
          path: dist/Sylnar.exe
          if-no-files-found: error

  release:
    # Publishing a release makes every installed copy auto-update to it, so
    # this only runs for a pushed v* tag, never for ordinary branch pushes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sylnar

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" Sylnar.exe
          --repo "${{ github.repository }}"
          --title "Sylnar ${{ github.ref_name }}"
          --notes "See the commit history for the changes in this release."
